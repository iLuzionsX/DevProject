name: RenoDX AMD bridge compile

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "renodx-amd/**"
      - ".github/workflows/renodx-amd-compile.yml"
  push:
    branches: [main]
    paths:
      - "renodx-amd/**"
      - ".github/workflows/renodx-amd-compile.yml"

concurrency:
  group: renodx-amd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RENODX_SHA: 8d360960a8bdeccada1a1babf7f02215c15c82e8
      FFX_REF: v2.3.0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "renodx-amd-${{ github.workflow }}"

    steps:
      - name: Checkout bridge branch
        uses: actions/checkout@v4
        with:
          path: bridge

      - name: Checkout pinned RenoDX
        uses: actions/checkout@v4
        with:
          repository: clshortfuse/renodx
          ref: ${{ env.RENODX_SHA }}
          submodules: recursive
          path: renodx

      - name: Checkout pinned FidelityFX SDK
        uses: actions/checkout@v4
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: ${{ env.FFX_REF }}
          path: fidelityfx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pins and source files
        shell: pwsh
        run: |
          $actualReno = (git -C renodx rev-parse HEAD).Trim()
          if ($actualReno -ne $env:RENODX_SHA) {
            throw "RenoDX pin mismatch: $actualReno"
          }
          $required = @(
            "bridge/renodx-amd/src/amd_bridge.hpp",
            "bridge/renodx-amd/src/ffx_runtime_loader.hpp",
            "bridge/renodx-amd/src/ffx_upscale_backend_dx12.hpp",
            "bridge/renodx-amd/src/ffx_support_probe_dx12.hpp",
            "bridge/renodx-amd/src/universal/universal_frame.hpp",
            "bridge/renodx-amd/src/universal/backend.hpp",
            "bridge/renodx-amd/src/universal/camera_motion_dx12.hpp",
            "bridge/renodx-amd/src/universal/capture.hpp",
            "bridge/renodx-amd/src/universal/discovery.hpp",
            "bridge/renodx-amd/src/universal/reconstruction.hpp",
            "bridge/renodx-amd/src/universal/routing.hpp",
            "bridge/renodx-amd/src/universal/streamline_frame_adapter.hpp",
            "bridge/renodx-amd/shaders/camera_motion_cs.hlsl",
            "bridge/renodx-amd/tests/universal_core_smoke.cpp",
            "bridge/renodx-amd/scripts/materialize_integration.py",
            "bridge/renodx-amd/scripts/harden_streamline_contract.py",
            "bridge/renodx-amd/scripts/wire_universal_core.py",
            "fidelityfx/Kits/FidelityFX/api/include/ffx_api.h",
            "fidelityfx/Kits/FidelityFX/upscalers/include/ffx_upscale.h",
            "fidelityfx/Kits/FidelityFX/api/include/dx12/ffx_api_dx12.h"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required path: $path" }
          }

      - name: Materialize bridge into RenoDX worktree
        shell: pwsh
        run: |
          python bridge/renodx-amd/scripts/materialize_integration.py `
            --bridge-root bridge/renodx-amd `
            --renodx-root renodx
          if ($LASTEXITCODE -ne 0) { throw "Bridge materialization failed" }

          python bridge/renodx-amd/scripts/wire_universal_core.py `
            --bridge-root bridge/renodx-amd `
            --renodx-root renodx
          if ($LASTEXITCODE -ne 0) { throw "Universal core wiring failed" }

          python bridge/renodx-amd/scripts/harden_streamline_contract.py `
            --renodx-root renodx
          if ($LASTEXITCODE -ne 0) { throw "Streamline contract hardening failed" }

          git -C renodx diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          git -C renodx status --short

      - name: Set up sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up shader tools
        shell: pwsh
        working-directory: renodx
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Compile camera-motion reconstruction shader
        shell: pwsh
        run: |
          $dxc = Join-Path $env:GITHUB_WORKSPACE "renodx/bin/dxc.exe"
          if (-not (Test-Path $dxc)) { throw "DXC not found at $dxc" }
          & $dxc -T cs_6_0 -E main -WX `
            -Fo camera_motion_cs.dxil `
            bridge/renodx-amd/shaders/camera_motion_cs.hlsl
          if ($LASTEXITCODE -ne 0) { throw "Camera motion shader compile failed" }

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Compile universal core smoke test
        shell: pwsh
        run: |
          clang-cl /nologo /std:c++20 /EHsc /W4 /WX `
            /I bridge/renodx-amd/src `
            bridge/renodx-amd/tests/universal_core_smoke.cpp `
            /Fe:universal_core_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Universal core compile failed" }
          .\universal_core_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Universal core smoke test failed" }

      - name: Add FidelityFX headers to compiler include path
        shell: pwsh
        run: |
          $api = Join-Path $env:GITHUB_WORKSPACE "fidelityfx/Kits/FidelityFX/api/include"
          $upscalers = Join-Path $env:GITHUB_WORKSPACE "fidelityfx/Kits/FidelityFX/upscalers/include"
          "INCLUDE=$api;$upscalers;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure RenoDX x64
        working-directory: renodx
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build dlssfix integration target
        working-directory: renodx
        run: cmake --build --preset clang-x64-release --target dlssfix --verbose

      - name: Create hardware-test manifest
        shell: pwsh
        run: |
          @"
          bridge_sha=${{ github.sha }}
          renodx_sha=$env:RENODX_SHA
          fidelityfx_ref=$env:FFX_REF
          universal_frame=1
          camera_motion_shader=cs_6_0
          camera_motion_runtime=dx12
          "@ | Set-Content -Path hardware-test-manifest.txt -Encoding utf8

      - name: Upload hardware-test bundle
        uses: actions/upload-artifact@v4
        with:
          name: renodx-universal-dx12-${{ github.sha }}
          if-no-files-found: error
          path: |
            renodx/build/Release/renodx-dlssfix.addon64
            renodx/build/Release/renodx-dlssfix.pdb
            camera_motion_cs.dxil
            hardware-test-manifest.txt

      - name: Build RenoDX x64
        working-directory: renodx
        run: cmake --build --preset clang-x64-release --verbose

      - name: Show staged diff
        if: always()
        shell: pwsh
        run: git -C renodx diff --stat

      - name: Show sccache stats
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats
