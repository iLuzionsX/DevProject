name: RenoDX AMD bridge compile

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "renodx-amd/**"
      - ".github/workflows/renodx-amd-compile.yml"
  push:
    branches: [main]
    paths:
      - "renodx-amd/**"
      - ".github/workflows/renodx-amd-compile.yml"

concurrency:
  group: renodx-amd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RENODX_SHA: 8d360960a8bdeccada1a1babf7f02215c15c82e8
      FFX_REF: v2.3.0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "renodx-amd-${{ github.workflow }}"

    steps:
      - name: Checkout bridge branch
        uses: actions/checkout@v4
        with:
          path: bridge

      - name: Checkout pinned RenoDX
        uses: actions/checkout@v4
        with:
          repository: clshortfuse/renodx
          ref: ${{ env.RENODX_SHA }}
          submodules: recursive
          path: renodx

      - name: Checkout pinned FidelityFX SDK
        uses: actions/checkout@v4
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: ${{ env.FFX_REF }}
          path: fidelityfx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pins and source files
        shell: pwsh
        run: |
          $actualReno = (git -C renodx rev-parse HEAD).Trim()
          if ($actualReno -ne $env:RENODX_SHA) {
            throw "RenoDX pin mismatch: $actualReno"
          }
          $required = @(
            "bridge/renodx-amd/src/amd_bridge.hpp",
            "bridge/renodx-amd/src/ffx_runtime_loader.hpp",
            "bridge/renodx-amd/src/ffx_upscale_backend_dx12.hpp",
            "bridge/renodx-amd/src/ffx_support_probe_dx12.hpp",
            "bridge/renodx-amd/scripts/materialize_integration.py",
            "bridge/renodx-amd/scripts/harden_streamline_contract.py",
            "fidelityfx/Kits/FidelityFX/api/include/ffx_api.h",
            "fidelityfx/Kits/FidelityFX/upscalers/include/ffx_upscale.h",
            "fidelityfx/Kits/FidelityFX/api/include/dx12/ffx_api_dx12.h"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required path: $path" }
          }

      - name: Materialize bridge into RenoDX worktree
        shell: pwsh
        run: |
          python bridge/renodx-amd/scripts/materialize_integration.py `
            --bridge-root bridge/renodx-amd `
            --renodx-root renodx
          if ($LASTEXITCODE -ne 0) { throw "Bridge materialization failed" }

          python bridge/renodx-amd/scripts/harden_streamline_contract.py `
            --renodx-root renodx
          if ($LASTEXITCODE -ne 0) { throw "Streamline contract hardening failed" }

          git -C renodx diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          git -C renodx status --short

      - name: Set up sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up shader tools
        shell: pwsh
        working-directory: renodx
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Add FidelityFX headers to compiler include path
        shell: pwsh
        run: |
          $api = Join-Path $env:GITHUB_WORKSPACE "fidelityfx/Kits/FidelityFX/api/include"
          $upscalers = Join-Path $env:GITHUB_WORKSPACE "fidelityfx/Kits/FidelityFX/upscalers/include"
          "INCLUDE=$api;$upscalers;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure RenoDX x64
        working-directory: renodx
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build dlssfix integration target
        working-directory: renodx
        run: cmake --build --preset clang-x64-release --target dlssfix --verbose

      - name: Build RenoDX x64
        working-directory: renodx
        run: cmake --build --preset clang-x64-release --verbose

      - name: Show staged diff
        if: always()
        shell: pwsh
        run: git -C renodx diff --stat

      - name: Show sccache stats
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats
